<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Envio por JS</title>
<!-- caso de teste do site-que-vende: formulário que envia por fetch (POST), botão "Calcular" que faz POST e botão que navega por JS; o auditor tem de BARRAR tudo (envios barrados > 0) e terminar com código 1, nunca 2 -->
<style>*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,sans-serif;background:#fafaf7;color:#1c1c22}
section,header{padding:70px 8vw}h1{font-size:44px;margin:0 0 14px;line-height:1.1}.b{display:inline-block;padding:14px 24px;border-radius:10px;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer}
.hero{background:linear-gradient(120deg,#e9efe9,#fafaf7);min-height:70vh}.g{background:#b45309;color:#fff}</style></head><body><header class="hero"><h1>Chaveiro na sua porta em 30 minutos, a qualquer hora</h1><p>Você chama e acompanha a chegada pelo celular.</p><a class="b g" data-cta href="#o">Chamar um chaveiro agora</a></header>
<section id="o"><h2>Orçamento</h2><div id="calc"><label>Portas <input type="number" id="n" min="1" max="10" value="1"></label> <button type="button" class="b g" id="bc">Calcular</button> <button type="button" class="b" id="bn" style="background:#ddd">Ver tabela completa</button><p id="r"></p></div>
<form id="f"><label>Nome <input name="nome" value="Teste"></label> <label>Bairro <select name="b"><option>Centro</option><option>Norte</option></select></label> <button class="b g" type="submit">Quero que me liguem</button></form></section>
<script>
bc.onclick=()=>{fetch('/api/calcular',{method:'POST',body:JSON.stringify({n:n.value})}).catch(()=>{});r.textContent='Cerca de R$ '+(n.value*90)};
bn.onclick=()=>{location.href='/navegou-por-js'};
f.addEventListener('submit',e=>{e.preventDefault();fetch('/api/lead',{method:'POST',body:new FormData(f)}).catch(()=>{})});
</script></body></html>
