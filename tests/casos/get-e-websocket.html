<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GET e WebSocket</title>
<!-- caso (3ª revisão): ao calcular, a página manda GET com dados, um pixel e abre WebSocket; o auditor tem de barrar e listar os três -->
<style>*{box-sizing:border-box}body{margin:0;font:17px/1.5 system-ui,sans-serif;background:#fafaf7;color:#1c1c22}section,header{padding:70px 8vw}h1{font-size:44px;margin:0 0 14px;line-height:1.1}.b{display:inline-block;padding:14px 24px;border-radius:10px;text-decoration:none;border:0;font:inherit;font-weight:700;cursor:pointer}.hero{background:linear-gradient(120deg,#e9efe9,#fafaf7);min-height:70vh}.g{background:#b45309;color:#fff}.o{background:transparent;border:2px solid #1d4ed8;color:#1d4ed8}</style></head><body><header class="hero"><h1>Conserto de geladeira em casa no mesmo dia</h1><p>Você vê o preço antes de chamar.</p><a class="b g" data-cta href="#o">Ver o preço do conserto</a></header>
<section id="o"><h2>Quanto custa</h2><div id="calc"><label>Portas <input type="number" id="n" min="1" max="4" value="1"></label> <button type="button" class="b g" id="bc">Calcular</button><p id="r"></p></div></section>
<script>bc.onclick=()=>{fetch('/api/click-get?svc=180&phone=999').catch(()=>{});new Image().src='/pixel.gif?ev=calc';try{new WebSocket('ws://'+location.host+'/ws')}catch(e){};r.textContent='Cerca de R$ '+(n.value*180)};</script></body></html>
